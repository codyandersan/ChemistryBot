<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChemBot Class 12</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>ChemBot Class 12</h1>
  </header>
  
  <main id="chat-container">
    <div id="messages"></div>
  </main>
  
  <footer>
    <div class="input-wrapper">
      <textarea id="user-input" placeholder="Ask a chemistry question..." rows="1"></textarea>
      <button id="send-btn">Send</button>
    </div>
  </footer>

  <script src="chat.js"></script>
</body>
</html>
